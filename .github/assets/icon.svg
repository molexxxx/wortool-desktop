<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WoRTool">
    <defs>
        <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d4b36a" />
            <stop offset="1" stop-color="#a8822f" />
        </linearGradient>
    </defs>

    <style>
        .plot
        {
            stroke-dasharray: 100;
            animation: plot 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .ring
        {
            animation: settle 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes plot
        {
            from { stroke-dashoffset: 100; }
            to { stroke-dashoffset: 0; }
        }
        @keyframes settle
        {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce)
        {
            .plot, .ring { animation: none; }
        }
    </style>

    <g class="ring" fill="none" stroke="#b8923e" stroke-width="2.4">
        <circle cx="32" cy="32" r="26" stroke-opacity="0.7" />
        <path d="M32 3 V9.5 M32 54.5 V61 M3 32 H9.5 M54.5 32 H61" stroke-opacity="0.9" stroke-linecap="round" />
    </g>
    <path
        class="plot"
        d="M17 21.5 L24.5 44.5 L32 30 L39.5 44.5 L47 21.5"
        fill="none"
        stroke="url(#brass)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        pathLength="100"
    />
</svg>
