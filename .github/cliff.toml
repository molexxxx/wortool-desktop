# git-cliff configuration for the desktop's release notes.
#
# The monorepo writes plain imperative commit subjects rather than conventional
# commits, so nothing is grouped by type: every subject that touched the
# desktop between two desktop tags is one line of the notes, newest first.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{%- endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "newest"

# Release commits carry no news of their own.
commit_parsers = [
    { message = "^Release desktop", skip = true },
    { message = ".*", group = "Changes" },
]

tag_pattern = "desktop-v[0-9]*"
